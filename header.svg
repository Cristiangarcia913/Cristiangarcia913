<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Accent Neon Cyan to Purple Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Wave Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="1000" height="240" rx="16" fill="url(#bgGrad)"/>
  <rect width="1000" height="240" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Decorative Modern Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.25">
    <line x1="100" y1="0" x2="100" y2="240" />
    <line x1="300" y1="0" x2="300" y2="240" />
    <line x1="500" y1="0" x2="500" y2="240" />
    <line x1="700" y1="0" x2="700" y2="240" />
    <line x1="900" y1="0" x2="900" y2="240" />
    <line x1="0" y1="60" x2="1000" y2="60" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="180" x2="1000" y2="180" />
  </g>

  <!-- Stylized Cyber Waves in Bottom-Right -->
  <path d="M 500,240 Q 650,150 800,190 T 1000,160 L 1000,240 Z" fill="#4338ca" fill-opacity="0.25"/>
  <path d="M 600,240 Q 750,140 880,180 T 1000,130 L 1000,240 Z" fill="#38bdf8" fill-opacity="0.15"/>
  <path d="M 400,240 C 600,130 750,230 1000,120" fill="none" stroke="url(#neonGrad)" stroke-width="2.5" filter="url(#glow)" opacity="0.8"/>

  <!-- Code Tag Pill -->
  <g transform="translate(60, 42)">
    <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.7"/>
    <circle cx="14" cy="14" r="4" fill="#38bdf8"/>
    <text x="28" y="18" fill="#94a3b8" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">SOFTWARE ENGINEER</text>
  </g>

  <!-- Main Name Title -->
  <text x="60" y="125" fill="#ffffff" font-family="'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    Cristian García Del Olmo
  </text>

  <!-- Subtitle with Gradient Accent -->
  <text x="60" y="165" fill="url(#neonGrad)" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="0.2">
    Grado en Ingeniería Informática · Universidad Camilo José Cela (UCJC)
  </text>

  <!-- Tagline / Skills -->
  <text x="60" y="198" fill="#94a3b8" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
    🚀 Full Stack Web &amp; Backend · 🤖 IA Multimodal · 🐧 Linux Systems &amp; Security · 📊 Calidad de Software
  </text>
</svg>
